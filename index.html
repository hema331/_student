
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Event Registration Portal</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f6fc;
    color: #333;
}

header {
    background: linear-gradient(135deg, #0756a8, #3988e8);
    color: white;
    text-align: center;
    padding: 30px 15px;
}

header h1 {
    margin: 0;
    font-size: 30px;
}

nav {
    background: #063d78;
    padding: 15px;
    text-align: center;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 0 15px;
    font-weight: bold;
}

nav a:hover {
    color: #ffda79;
}

main {
    max-width: 1000px;
    margin: 25px auto;
    padding: 15px;
}

section {
    background: white;
    margin-bottom: 25px;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 3px 10px #00000015;
}

h2 {
    color: #0756a8;
}

input, select {
    width: 100%;
    padding: 12px;
    margin: 8px 0 15px;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 15px;
}

label {
    font-weight: bold;
}

.event-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 20px;
    margin-top: 20px;
}

.event-card {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 18px;
    background: white;
}

.event-card h3 {
    color: #0756a8;
}

.event-card p {
    line-height: 1.6;
    white-space: pre-line;
}

button {
    background: #087c43;
    color: white;
    padding: 12px 18px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 15px;
    margin: 5px 0;
}

button:hover {
    background: #055d32;
}

button:disabled {
    background: #999;
    cursor: not-allowed;
}

.cancel-btn {
    background: #d93025;
}

.cancel-btn:hover {
    background: #a51e16;
}

#message {
    font-weight: bold;
}

.registered-item {
    border-bottom: 1px solid #ddd;
    padding: 12px 0;
    overflow-wrap: anywhere;
}

footer {
    background: #063d78;
    color: white;
    text-align: center;
    padding: 15px;
}

@media (max-width: 600px) {
    header h1 {
        font-size: 23px;
    }

    nav a {
        display: inline-block;
        margin: 7px;
    }

    section {
        padding: 15px;
    }
}
</style>
</head>

<body>

<header>
    <h1>College Event Registration Portal</h1>
    <p>Explore Events | Register | Participate</p>
</header>

<nav>
    <a href="#events">Events</a>
    <a href="#register">Register</a>
    <a href="#myEvents">My Registrations</a>
</nav>

<main>

    <section id="events">
        <h2>Upcoming College Events</h2>

        <input
            type="text"
            id="search"
            placeholder="Search events by name..."
        >

        <select id="categoryFilter">
            <option value="All">All Categories</option>
            <option value="Technical">Technical</option>
            <option value="Cultural">Cultural</option>
            <option value="Sports">Sports</option>
        </select>

        <div id="eventList" class="event-container"></div>
    </section>

    <section id="register">
        <h2>Student Registration</h2>

        <form id="registrationForm">
            <label for="studentName">Student Name:</label>
            <input
                type="text"
                id="studentName"
                placeholder="Enter your name"
                required
            >

            <label for="email">Email Address:</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="department">College / Department:</label>
            <input
                type="text"
                id="department"
                placeholder="Enter your department"
                required
            >

            <label for="eventSelect">Select Event:</label>
            <select id="eventSelect" required>
                <option value="">Choose an event</option>
            </select>

            <button type="submit">Register Now</button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>
    </section>

    <section id="myEvents">
        <h2>My Registered Events</h2>
        <div id="registeredList"></div>
    </section>

</main>

<footer>
    <p>&copy; 2026 College Event Registration Portal</p>
</footer>

<script>
// Event details
const events = [
    {
        id: 1,
        title: "Web Development Workshop",
        date: "2026-11-05",
        venue: "Computer Lab",
        category: "Technical",
        description: "Learn HTML, CSS and JavaScript.",
        capacity: 30
    },
    {
        id: 2,
        title: "Cultural Fest",
        date: "2026-11-10",
        venue: "College Auditorium",
        category: "Cultural",
        description: "Participate in dance, music and drama.",
        capacity: 50
    },
    {
        id: 3,
        title: "Coding Competition",
        date: "2026-11-15",
        venue: "Computer Lab",
        category: "Technical",
        description: "Show your programming skills.",
        capacity: 25
    },
    {
        id: 4,
        title: "Sports Day",
        date: "2026-11-20",
        venue: "College Ground",
        category: "Sports",
        description: "Participate in exciting sports events.",
        capacity: 100
    }
];

// Load saved registrations
let registrations = [];

try {
    const saved = JSON.parse(
        localStorage.getItem("registrations") || "[]"
    );

    if (Array.isArray(saved)) {
        registrations = saved.filter(r =>
            r &&
            Number.isFinite(r.id) &&
            Number.isInteger(r.eventId) &&
            typeof r.name === "string" &&
            typeof r.email === "string" &&
            typeof r.department === "string" &&
            events.some(event => event.id === r.eventId)
        );
    }
} catch (error) {
    registrations = [];
}

const eventList = document.getElementById("eventList");
const eventSelect = document.getElementById("eventSelect");
const registrationForm = document.getElementById("registrationForm");
const message = document.getElementById("message");

// Save data in browser storage
function saveRegistrations() {
    try {
        localStorage.setItem(
            "registrations",
            JSON.stringify(registrations)
        );
        return true;
    } catch (error) {
        message.textContent =
            "Unable to save data in this browser.";
        message.style.color = "red";
        return false;
    }
}

// Count registrations
function getCount(eventId) {
    return registrations.filter(
        registration => registration.eventId === eventId
    ).length;
}

// Display event cards
function displayEvents() {
    const searchText = document
        .getElementById("search")
        .value.trim()
        .toLowerCase();

    const category =
        document.getElementById("categoryFilter").value;

    eventList.innerHTML = "";

    const filteredEvents = events.filter(event => {
        return event.title.toLowerCase().includes(searchText) &&
            (category === "All" || event.category === category);
    });

    if (filteredEvents.length === 0) {
        eventList.textContent = "No events found.";
        return;
    }

    filteredEvents.forEach(event => {
        const count = getCount(event.id);
        const available = event.capacity - count;

        const card = document.createElement("div");
        card.className = "event-card";

        const title = document.createElement("h3");
        title.textContent = event.title;

        const details = document.createElement("p");
        details.textContent =
            "Date: " + event.date +
            "\nVenue: " + event.venue +
            "\nCategory: " + event.category +
            "\nDescription: " + event.description +
            "\nRegistrations: " + count + "/" + event.capacity +
            "\nAvailable seats: " + available;

        const button = document.createElement("button");
        button.textContent = available <= 0
            ? "Event Full"
            : "Register for Event";
        button.disabled = available <= 0;

        button.addEventListener("click", () => {
            eventSelect.value = String(event.id);

            document.getElementById("register").scrollIntoView({
                behavior: "smooth"
            });
        });

        card.append(title, details, button);
        eventList.appendChild(card);
    });
}

// Populate event selection
function loadEventOptions() {
    eventSelect.innerHTML =
        '<option value="">Choose an event</option>';

    events.forEach(event => {
        const option = document.createElement("option");
        option.value = event.id;
        option.textContent = event.title;
        eventSelect.appendChild(option);
    });
}

// Handle student registration
registrationForm.addEventListener("submit", function(e) {
    e.preventDefault();

    const name = document
        .getElementById("studentName").value.trim();

    const email = document
        .getElementById("email").value.trim().toLowerCase();

    const department = document
        .getElementById("department").value.trim();

    const eventId = Number(eventSelect.value);

    const selectedEvent = events.find(
        event => event.id === eventId
    );

    if (!name || !email || !department || !selectedEvent) {
        message.textContent = "Please complete all fields.";
        message.style.color = "red";
        return;
    }

    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (!emailPattern.test(email)) {
        message.textContent = "Please enter a valid email.";
        message.style.color = "red";
        return;
    }

    // Prevent duplicate registrations
    const alreadyRegistered = registrations.some(registration =>
        registration.eventId === eventId &&
        registration.email === email
    );

    if (alreadyRegistered) {
        message.textContent =
            "You have already registered for this event.";
        message.style.color = "red";
        return;
    }

    // Check capacity
    if (getCount(eventId) >= selectedEvent.capacity) {
        message.textContent = "Sorry, this event is full.";
        message.style.color = "red";
        return;
    }

    const newRegistration = {
        id: Date.now(),
        name: name,
        email: email,
        department: department,
        eventId: eventId
    };

    registrations.push(newRegistration);

    if (!saveRegistrations()) {
        registrations.pop();
        return;
    }

    message.textContent =
        "Registration successful! Welcome, " + name + ".";
    message.style.color = "green";

    registrationForm.reset();

    displayEvents();
    displayRegistrations();
});

// Show registered students and cancellation buttons
function displayRegistrations() {
    const registeredList =
        document.getElementById("registeredList");

    registeredList.innerHTML = "";

    if (registrations.length === 0) {
        registeredList.textContent = "No registrations yet.";
        return;
    }

    registrations.forEach(registration => {
        const event = events.find(
            item => item.id === registration.eventId
        );

        if (!event) return;

        const item = document.createElement("div");
        item.className = "registered-item";

        const details = document.createElement("p");
        details.textContent =
            "Student: " + registration.name +
            " | Event: " + event.title +
            " | Email: " + registration.email +
            " | Department: " + registration.department;

        const cancelButton = document.createElement("button");
        cancelButton.className = "cancel-btn";
        cancelButton.textContent = "Cancel Registration";

        cancelButton.addEventListener("click", () => {
            const confirmed = confirm(
                "Are you sure you want to cancel this registration?"
            );

            if (!confirmed) return;

            const oldRegistrations = registrations;

            registrations = registrations.filter(
                r => r.id !== registration.id
            );

            if (!saveRegistrations()) {
                registrations = oldRegistrations;
                return;
            }

            displayEvents();
            displayRegistrations();

            message.textContent =
                "Registration cancelled successfully.";
            message.style.color = "green";
        });

        item.append(details, cancelButton);
        registeredList.appendChild(item);
    });
}

// Search and filter
document.getElementById("search")
    .addEventListener("input", displayEvents);

document.getElementById("categoryFilter")
    .addEventListener("change", displayEvents);

// Initialize the portal
loadEventOptions();
displayEvents();
displayRegistrations();
</script>

</body>
</html>
